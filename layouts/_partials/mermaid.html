{{- $mermaidInitJs := resources.Get "js/mermaid-init.js" | minify | fingerprint -}}
<style>
  .markdown-body .mermaid,
  .markdown-body .mermaid svg {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  }

  .markdown-body .mermaid {
    margin: 1.25rem 0;
    padding: 0.75rem;
    border: 1px solid var(--borderColor-default, #d0d7de);
    border-radius: 6px;
    background: var(--bgColor-muted, #f6f8fa);
    overflow-x: auto;
  }

  .markdown-body .mermaid svg {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    height: auto;
  }

  .markdown-body .mermaid svg text.actor,
  .markdown-body .mermaid svg .messageText,
  .markdown-body .mermaid svg .label text {
    fill: var(--fgColor-default, #24292f) !important;
    color: var(--fgColor-default, #24292f) !important;
  }

  .markdown-body .mermaid svg .labelBkg,
  .markdown-body .mermaid svg .edgeLabel rect {
    fill: var(--bgColor-default, #ffffff) !important;
    stroke: var(--borderColor-default, #d0d7de) !important;
  }

  .markdown-body .mermaid svg .sectionTitle,
  .markdown-body .mermaid svg .titleText {
    fill: var(--fgColor-default, #24292f) !important;
    color: var(--fgColor-default, #24292f) !important;
  }

  html[data-color-mode="dark"] .markdown-body .mermaid {
    background: var(--bgColor-neutral-muted, #161b22);
    border-color: var(--borderColor-muted, #30363d);
  }

  html[data-color-mode="dark"] .markdown-body .mermaid :is(text, tspan, .messageText, .loopText, .noteText) {
    fill: var(--fgColor-default, #e6edf3) !important;
    color: var(--fgColor-default, #e6edf3) !important;
  }

  html[data-color-mode="dark"] .markdown-body .mermaid svg text.actor,
  html[data-color-mode="dark"] .markdown-body .mermaid svg .messageText,
  html[data-color-mode="dark"] .markdown-body .mermaid svg .label text {
    fill: var(--fgColor-default, #e6edf3) !important;
    color: var(--fgColor-default, #e6edf3) !important;
  }

  html[data-color-mode="dark"] .markdown-body .mermaid svg .labelBkg,
  html[data-color-mode="dark"] .markdown-body .mermaid svg .edgeLabel rect {
    fill: var(--bgColor-muted, #161b22) !important;
    stroke: var(--borderColor-muted, #30363d) !important;
  }

  html[data-color-mode="dark"] .markdown-body .mermaid svg .sectionTitle,
  html[data-color-mode="dark"] .markdown-body .mermaid svg .titleText {
    fill: var(--fgColor-default, #e6edf3) !important;
    color: var(--fgColor-default, #e6edf3) !important;
  }

  @media (prefers-color-scheme: dark) {
    html[data-color-mode="auto"] .markdown-body .mermaid {
      background: var(--bgColor-neutral-muted, #161b22);
      border-color: var(--borderColor-muted, #30363d);
    }

    html[data-color-mode="auto"] .markdown-body .mermaid :is(text, tspan, .messageText, .loopText, .noteText) {
      fill: var(--fgColor-default, #e6edf3) !important;
      color: var(--fgColor-default, #e6edf3) !important;
    }

    html[data-color-mode="auto"] .markdown-body .mermaid svg text.actor,
    html[data-color-mode="auto"] .markdown-body .mermaid svg .messageText,
    html[data-color-mode="auto"] .markdown-body .mermaid svg .label text {
      fill: var(--fgColor-default, #e6edf3) !important;
      color: var(--fgColor-default, #e6edf3) !important;
    }

    html[data-color-mode="auto"] .markdown-body .mermaid svg .labelBkg,
    html[data-color-mode="auto"] .markdown-body .mermaid svg .edgeLabel rect {
      fill: var(--bgColor-muted, #161b22) !important;
      stroke: var(--borderColor-muted, #30363d) !important;
    }

    html[data-color-mode="auto"] .markdown-body .mermaid svg .sectionTitle,
    html[data-color-mode="auto"] .markdown-body .mermaid svg .titleText {
      fill: var(--fgColor-default, #e6edf3) !important;
      color: var(--fgColor-default, #e6edf3) !important;
    }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.10.1/dist/mermaid.min.js" defer></script>
<script src="{{ $mermaidInitJs.RelPermalink }}" integrity="{{ $mermaidInitJs.Data.Integrity }}" defer></script>
